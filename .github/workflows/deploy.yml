
name: Docker Demo - Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: springboot-app


jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot JAR
      - name: Build JAR
        run: mvn clean package -DskipTests



      # 4. building docker image
      - name: Building docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest .


      #5 login to docker hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      #6 push image to docker hub
      - name: Build and Push Docker Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest



      # 7. Deploy to EC2 using SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
           docker pull ${{ secrets.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}:latest
           docker stop springboot-app || true
           docker rm springboot-app || true
            docker run -d \ --name springboot-app \ --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}:latest 
            
            
           docker image prune -f

           
